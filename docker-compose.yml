services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    # Sin puertos publicados: el túnel llega a http://web:80 por la red interna de Docker.

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN en .env (copia .env.example a .env)}
    depends_on:
      web:
        condition: service_healthy
