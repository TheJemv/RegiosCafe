services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    # Solo para probar en local (http://localhost:8080). El túnel no necesita este puerto.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN en .env (copia .env.example a .env)}
    depends_on:
      web:
        condition: service_healthy
